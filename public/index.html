<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nigeria Action World 3D</title>
  <meta name="theme-color" content="#050811" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  
  <link rel="stylesheet" href="styles.css" />

  <!-- 3D Engine Libraries & Supabase -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Fullscreen Centered Phone Rotation Overlay -->
  <div id="orientation-warning">
    <div class="phone-container"><div class="phone-icon"></div></div>
    <p>Please rotate your phone to landscape mode</p>
    <span>Rotate device to play</span>
  </div>

  <!-- Initial System Loading Overlay -->
  <div id="loader-overlay">
    <div class="loader-title">NIGERIA ACTION WORLD 3D</div>
    <div class="loader-subtitle">Building street grids, realistic lighting & character models...</div>
    <div class="loader-bar-bg"><div id="loader-fill" class="loader-bar-fill"></div></div>
    <div id="loader-status-text" class="loader-status">Initializing Game Systems 0%</div>
  </div>

  <!-- Dialogue Subtitles -->
  <div id="dialogue-subtitle"></div>

  <!-- GTA V Style HUD Bar -->
  <div id="hud-container" style="display:none;">
    <div class="hud-cash" id="hud-cash-text">₦250,000</div>
    <div class="hud-status-bars">
      <div class="bar-wrapper"><div class="bar-fill-health" id="hud-health-bar"></div></div>
      <div class="bar-wrapper"><div class="bar-fill-armor" id="hud-armor-bar"></div></div>
    </div>
    <div class="hud-wanted-stars" id="hud-wanted-text"></div>
  </div>

  <!-- Character Customization Menu Overlay -->
  <div id="customization-overlay" style="display:none;">
    <div class="modal-card">
      <h2>CHARACTER WARDROBE</h2>
      <div class="setting-row">
        <label>Gender:</label>
        <select id="cust-gender" onchange="updatePlayerAppearance()">
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Hairstyle:</label>
        <select id="cust-hair" onchange="updatePlayerAppearance()">
          <option value="short">Short Cut / Fade</option>
          <option value="afro">Afro / Locs</option>
          <option value="buzz">Buzz Cut</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Outfit Color:</label>
        <input type="color" id="cust-color" value="#38bdf8" onchange="updatePlayerAppearance()" />
      </div>
      <button class="btn-resume" onclick="closeCustomization()">Save & Continue</button>
    </div>
  </div>

  <!-- Top Pause & Sync Utility Bar -->
  <div id="top-bar" style="position:fixed; top:16px; left:16px; z-index:30000; display:none; gap:10px;">
    <button class="top-btn" onclick="togglePauseMenu()" style="padding:8px 14px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:6px; font-weight:bold;">Pause</button>
    <button class="top-btn" onclick="openCustomization()" style="padding:8px 14px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:6px; font-weight:bold;">Style</button>
  </div>

  <!-- Pause Settings Modal -->
  <div id="pause-overlay" style="display:none;">
    <div class="modal-card">
      <h2>GAME SETTINGS</h2>
      <div class="setting-row">
        <label>Graphics Quality</label>
        <select id="setting-graphics" onchange="updateSettings()">
          <option value="high">High (Shadows & Lights)</option>
          <option value="medium">Medium (Standard)</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Frame Rate Limit</label>
        <select id="setting-fps" onchange="updateSettings()">
          <option value="60">60 FPS Smooth</option>
          <option value="30">30 FPS Power Saver</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Audio & Speech</label>
        <select id="setting-audio" onchange="updateSettings()">
          <option value="enabled">Audio & Voices On</option>
          <option value="disabled">Mute Audio</option>
        </select>
      </div>
      <button class="btn-resume" onclick="togglePauseMenu()">Resume Operations</button>
    </div>
  </div>

  <!-- 3D WebGL Canvas Container -->
  <div id="game-container"></div>

  <!-- Controls & Camera Drag Layer -->
  <div id="controls-layer">
    <div id="touch-touchpad"></div>
    <div id="camera-dragzone"></div>
    
    <div id="analog-base"><div id="analog-stick"></div></div>
    
    <div id="action-buttons" style="display:none;">
      <div id="btn-punch" class="touch-btn">ATTACK</div>
      <div id="btn-sprint" class="touch-btn">SPRINT</div>
      <div id="btn-action" class="touch-btn" style="display:none; background: rgba(34, 197, 94, 0.8);">STORE</div>
      <div id="btn-enter" class="touch-btn" style="display:none; background: rgba(56, 189, 248, 0.8);">ENTER</div>
    </div>
  </div>

  <!-- Game Logic Scripts -->
  <script src="js/systems/combat.js"></script>
  <script src="js/systems/ai.js"></script>
  <script src="js/scenes/WorldScene3D.js"></script>
  <script src="js/config3d.js"></script>
</body>
</html>
