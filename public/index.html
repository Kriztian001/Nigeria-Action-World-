<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Nigeria Action World</title>
  <meta name="theme-color" content="#050811" />
  
  <!-- 3D Engine CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050811; font-family: sans-serif; }
    #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Loader Overlay */
    #loader-overlay {
      position: fixed; inset: 0; background: #020617; z-index: 50000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    }
    .loader-title { color: #38bdf8; font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; text-align: center; }
    .loader-subtitle { color: #94a3b8; font-size: 0.8rem; margin-bottom: 24px; text-align: center; }
    .loader-bar-bg { width: 260px; height: 10px; background: #1e293b; border-radius: 20px; overflow: hidden; border: 1px solid #334155; }
    .loader-bar-fill { width: 0%; height: 100%; background: #38bdf8; transition: width 0.1s linear; }
    .loader-status { color: #64748b; font-size: 0.75rem; margin-top: 12px; font-weight: 600; }

    /* Portrait Warning */
    #orientation-warning {
      display: none; position: fixed; inset: 0; background: #000; z-index: 999999;
      flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 20px;
    }
    @media screen and (orientation: portrait) {
      #orientation-warning { display: flex !important; }
    }

    /* HUD */
    #hud-container { position: fixed; top: 16px; right: 20px; z-index: 30000; display: none; color: #22c55e; font-size: 1.4rem; font-weight: 900; }
  </style>
</head>
<body>

  <div id="orientation-warning">
    <h3>Please rotate your phone to landscape mode</h3>
  </div>

  <div id="loader-overlay">
    <div class="loader-title">NIGERIA ACTION WORLD 3D</div>
    <div class="loader-subtitle">Initializing Lagos Street Grids...</div>
    <div class="loader-bar-bg"><div id="loader-fill" class="loader-bar-fill"></div></div>
    <div id="loader-status-text" class="loader-status">Loading Systems 0%</div>
  </div>

  <div id="hud-container">₦250,000</div>
  <div id="game-container"></div>

  <!-- Inline Fallback Engine & Loader Script to Guarantee Execution -->
  <script>
    // Global State
    window.userStats = { outfitColor: '#38bdf8', cash: 250000 };
    window.moveAngle = null;
    window.isSprinting = false;

    // Guaranteed Loader Loop (Forces completion in 1.2 seconds no matter what)
    let progress = 0;
    const fill = document.getElementById('loader-fill');
    const statusText = document.getElementById('loader-status-text');
    const loaderOverlay = document.getElementById('loader-overlay');
    const hudContainer = document.getElementById('hud-container');

    const loadInterval = setInterval(() => {
      progress += 20;
      if (fill) fill.style.width = progress + '%';
      if (statusText) statusText.innerText = `Initializing Game Systems ${progress}%`;

      if (progress >= 100) {
        clearInterval(loadInterval);
        if (loaderOverlay) loaderOverlay.style.display = 'none';
        if (hudContainer) hudContainer.style.display = 'block';
        initSimple3DWorld();
      }
    }, 200);

    // Simple Built-in 3D World Scene to prevent missing script crashes
    function initSimple3DWorld() {
      const container = document.getElementById('game-container');
      if (!container || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050811);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Light
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0x38bdf8, 1);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Ground
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshStandardMaterial({ color: 0x1e293b })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Player Box
      const player = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 1.2, 0.4),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
      );
      player.position.y = 0.6;
      scene.add(player);

      // Render Loop
      function animate() {
        requestAnimationFrame(animate);
        player.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
